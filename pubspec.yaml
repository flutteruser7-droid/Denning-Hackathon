name: emergency_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  rive: 0.13.20
  flutter_svg: ^2.0.17
  http: ^1.6.0
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  shared_preferences: ^2.3.0
  google_generative_ai: ^0.4.7
  intl: ^0.20.2
  google_fonts: ^6.2.1
  url_launcher: ^6.2.0
  firebase_storage: ^14.0.0
  image_picker: ^1.1.2
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  permission_handler: ^12.0.0
  connectivity_plus: ^6.1.1
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.2

dependency_overrides:
  shared_preferences_android: 2.3.4
  # 2.5.1 is the last release without objective_c (its build hook breaks when
  # the Flutter SDK path contains spaces).
  path_provider_foundation: 2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/Backgrounds/
    - assets/RiveAssets/
    - assets/icons/
    - assets/avaters/
    - lib/.env
    - assets/emergency_protocols.json

  fonts:
    - family: Intel
      fonts:
        - asset: assets/Fonts/Inter-Regular.ttf
        - asset: assets/Fonts/Inter-SemiBold.ttf
          weight: 600
    - family: Poppins
      fonts:
        - asset: assets/Fonts/Poppins-Bold.ttf
          weight: 700
